server:
    listen: 0.0.0.0@53
    listen: ::@53

mod-append:
  - id: custom
    zone: root-servers.net.
    a: 46.62.230.96
    aaaa: 2a01:4f9:c012:5daa::1
    labels: [ a, b, c, d, e, f, g, h, i, j, k, l, m ]
  - id: customgtld
    zone: gtld-servers.net.
    a: 95.217.245.237
    aaaa: 2a01:4f9:c012:5daa::aa
    labels: [ a, b, c, d, e, f, g, h, i, j, k, l, m ]

mod-dnstap:
  - id: capture_all
    sink: unix:/run/dnstap/knot.sock

template:
  - id: default
    file: flip.zone
    storage: /storage/
    global-module: mod-dnstap/capture_all
    module: mod-append/custom
  - id: gtld
    file: flip-gtld.zone
    storage: /storage/
    module: mod-append/customgtld
  - id: none

policy:
  - id: manual
    manual: on
    unsafe-operation: no-update-dnskey

zone:
  # cds-consistency
  - domain: cds-consistency.w00t-servers.net
    template: none
    file: cds-consistency.w00t-servers.net.zone
    storage: /storage/
    dnssec-signing: on
    dnssec-policy: manual

  # original
  - domain: root-servers.net
    template: none
    file: root-servers.net.zone
    storage: /storage/
  - domain: gtld-servers.net
